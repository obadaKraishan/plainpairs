[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plainpairs"
dynamic = ["version"]
description = "A research corpus pairing the prescriber and patient texts of US medicine labels"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Obada Kraishan" }]
keywords = [
    "health-literacy",
    "health-communication",
    "risk-communication",
    "readability",
    "plain-language",
    "medication-guides",
    "dataset",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "defusedxml>=0.7.1",
    "pyarrow>=14",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
plainpairs = "plainpairs.cli:main"

[project.urls]
Repository = "https://github.com/obadaKraishan/plainpairs"
Issues = "https://github.com/obadaKraishan/plainpairs/issues"
Changelog = "https://github.com/obadaKraishan/plainpairs/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2611.21160"

[tool.hatch.version]
path = "src/plainpairs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plainpairs"]

# The sdist carries the code and the tests; never data.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["plainpairs"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
